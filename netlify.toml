[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # pdf-parse v2 (pdfjs) precisa de Node 22 (Promise.withResolvers) — senão a leitura de PDF falha
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # libs com requires dinâmicos: enviadas como estão, sem empacotar (unpdf é empacotado normal)
  external_node_modules = ["mammoth", "google-auth-library"]

# /api/* → funções (mantém o frontend chamando /api/... sem mudança)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA: qualquer rota cai no index (roteamento no cliente)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
