# Worker que sincroniza os editados. Cron a cada 20 min, mas cada rodada sincroniza SÓ UM time (round-robin),
# pra não empilhar os subrequests dos times numa chamada só. Com 3 times, cada um é sincronizado de hora em hora.
name = "central-gravacao-editados"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[triggers]
crons = ["*/20 * * * *"]
