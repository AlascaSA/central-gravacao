name: Processar brutos novos

# Dispara pelo botão no site (via API) ou manualmente aqui no GitHub.
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "id ou link de uma pasta pra escanear só ela (vazio = varre tudo)"
        required: false
      team:
        description: "id do time/professor do lote (grava na coluna team dos brutos)"
        required: false
        default: "jaylton"
      reclassificar:
        description: "true = re-classifica TODOS na ordem certa do número (mantém a transcrição)"
        required: false
        default: "false"

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Garantir ffmpeg
        # o apt do runner às vezes trava (26/10 ficou 30 min parado aqui): baixa o ffmpeg pronto
        # e só cai no apt se o download falhar; o passo inteiro tem teto de 5 min
        timeout-minutes: 5
        run: |
          ffmpeg -version >/dev/null 2>&1 && exit 0
          if curl -fsSL --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo install -m 755 /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar capas + metadados dos novos
        run: node scripts/gerar-capas.mjs ${{ inputs.pasta && format('--pasta {0}', inputs.pasta) || '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPA_SECRET: ${{ secrets.SUPA_SECRET }}
          TEAM: ${{ inputs.team || 'jaylton' }}

      - name: Classificar com IA (transcrição + tipo)
        run: node scripts/classificar-brutos.mjs ${{ inputs.reclassificar == 'true' && '--reclassificar' || '' }}
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPA_SECRET: ${{ secrets.SUPA_SECRET }}
          TEAM: ${{ inputs.team || 'jaylton' }}

      # Proxy é conforto do player, não pré-requisito de nada: fica DEPOIS da classificação, que é o
      # que trava a equipe. Antes ele vinha antes e a classificação esperava reencodar dezenas de vídeos.
      - name: Gerar proxies leves (720p) dos que ainda não têm
        run: node scripts/gerar-proxies.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPA_SECRET: ${{ secrets.SUPA_SECRET }}
          TEAM: ${{ inputs.team || 'jaylton' }}
