name: Processar brutos novos

# Dispara pelo botão no site (via API) ou manualmente aqui no GitHub.
on:
  workflow_dispatch:

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Garantir ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar versões leves (proxies) dos novos
        run: node scripts/gerar-proxies.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPA_SECRET: ${{ secrets.SUPA_SECRET }}

      - name: Transcrever e classificar os novos
        run: node scripts/classificar-brutos.mjs
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          SUPA_SECRET: ${{ secrets.SUPA_SECRET }}
