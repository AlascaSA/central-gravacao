name: Montar variações de anúncio

# Dispara pelo botão da aba Multiplicar (via API) ou manualmente aqui no GitHub.
# O pedido inteiro já está na tabela `montagens` do Supabase — aqui só chega o id.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "id da montagem na tabela `montagens`"
        required: true

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Garantir ffmpeg
        # o apt do runner às vezes trava (26/10 ficou 30 min parado aqui): baixa o ffmpeg pronto
        # e só cai no apt se o download falhar; o passo inteiro tem teto de 5 min
        timeout-minutes: 5
        run: |
          ffmpeg -version >/dev/null 2>&1 && exit 0
          if curl -fsSL --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo install -m 755 /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Montar e devolver ao Drive
        run: node scripts/montar-variacoes.mjs --job ${{ inputs.job }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPA_SECRET: ${{ secrets.SUPA_SECRET }}
          # o runner tem 2 vCPUs; mais que isso só faz as peças brigarem entre si
          PARALELO: "2"
